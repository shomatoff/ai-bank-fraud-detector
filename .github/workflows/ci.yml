name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -c constraints-verified.txt --upgrade pip
      - run: python -m pip install -c constraints-verified.txt -r requirements-dev.txt
      - run: python -m ruff check fraud_detector tests scripts
      - run: python -m pytest -q
      - run: python -m pip_audit
      - run: python -m fraud_detector.model
      - run: python -c "import json; from pathlib import Path; m=json.loads(Path('data/metrics.json').read_text()); assert m['test_rows'] == 3000; assert sum(m['confusion_matrix'].values()) == 3000"
